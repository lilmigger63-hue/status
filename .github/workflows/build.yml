name: Build Forge mod
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew build --console=plain
      - run: bash ./gradlew runGameTestServer --console=plain -x downloadAssets
      - uses: actions/upload-artifact@v4
        with:
          name: Medieval-Status-Forge-1.20.1
          path: build/libs/*.jar
